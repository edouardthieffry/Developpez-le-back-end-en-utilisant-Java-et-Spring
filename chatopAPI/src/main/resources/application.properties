spring.application.name=chatop
# Interface Swagger UI : http://localhost:3001/api/docs
springdoc.swagger-ui.path=/api/docs
# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/chatop_db?useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port de l'application
server.port=3001

# URL publique de l'application, utilisée pour construire les liens des images
app.url=${APP_URL:http://localhost:3001}
# Répertoire de stockage des images
app.upload.dir=${APP_UPLOAD_DIR:uploads}
